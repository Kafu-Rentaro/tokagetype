[package]
name = "tokage-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tokagetype native UI (egui/eframe) — foundation build"

[dependencies]
tokage-core = { path = "../tokage-core" }
eframe = { version = "0.29", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
gltf = { version = "1", features = ["import"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
